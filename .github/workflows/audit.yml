name: Audit
on:
  schedule:
    - cron: "17 5 * * *"
  pull_request:
    paths: ["src-tauri/Cargo.lock", "pnpm-lock.yaml", "deny.toml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Known vulnerabilities, and licences we cannot ship under Apache-2.0.
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories licenses

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12
      - run: pnpm audit --prod
